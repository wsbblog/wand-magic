<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔法画笔</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>魔法画笔</h1>
        <p class="subtitle">食指作画，手动调整笔画粗细</p>
      </div>
      <div class="runtime-status" id="runtimeStatus">未启动</div>
    </header>

    <main class="workspace">
      <section class="stage-wrap">
        <div class="stage" id="stage">
          <video id="camera" autoplay muted playsinline></video>
          <canvas id="drawCanvas"></canvas>
          <canvas id="effectCanvas"></canvas>
          <div class="calibration-target" id="calibrationTarget" hidden>
            <div class="calibration-ring"></div>
            <div class="calibration-label" id="calibrationLabel">请伸出食指放入圆圈</div>
            <div class="calibration-progress">
              <span id="calibrationProgress"></span>
            </div>
          </div>
          <div class="brush-status" id="brushStatus">手指：等待识别</div>
          <div class="brush-size-pill" id="brushSizePill">粗细 6</div>
        </div>
      </section>

      <aside class="control-panel">
        <section class="panel-section">
          <h2>启动</h2>
          <div class="button-grid">
            <button id="startButton" class="primary">开启摄像头</button>
            <button id="calibrateButton" disabled>校准食指</button>
            <button id="startDrawButton" class="primary" disabled>开始作画</button>
            <button id="clearButton" class="danger">清空画布</button>
            <button id="screenshotButton" class="primary" disabled>截图</button>
          </div>
          <div class="status-list">
            <div><span>摄像头</span><strong id="cameraStatus">未连接</strong></div>
            <div><span>手势识别</span><strong id="handStatus">未启用</strong></div>
          </div>
        </section>

        <section class="panel-section">
          <h2>画笔</h2>
          <div class="brush-mode-grid">
            <button id="normalBrushButton" class="brush-mode active">普通画笔</button>
            <button id="effectBrushButton" class="brush-mode">特效画笔</button>
            <button id="eraserButton" class="brush-mode">橡皮擦</button>
          </div>
          <h2>特效类型</h2>
          <div class="effect-type-grid" id="effectTypeGrid" hidden>
            <button class="effect-type" data-effect="fire">火焰</button>
            <button class="effect-type" data-effect="water">清水</button>
            <button class="effect-type" data-effect="star">星光</button>
            <button class="effect-type" data-effect="lightning">闪电</button>
          </div>
          <h2>颜色</h2>
          <div class="color-grid" id="colorGrid"></div>
          <h2>粗细</h2>
          <input id="brushSizeInput" class="brush-size-input" type="range" min="2" max="48" step="1" value="6">
          <div class="brush-size-note">拖动滑块手动调整笔画粗细</div>
        </section>

        <section class="panel-section">
          <h2>截图</h2>
          <img id="screenshotPreview" class="screenshot-preview" alt="截图预览" hidden>
          <button id="saveScreenshotButton" class="primary" hidden>保存图片</button>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
