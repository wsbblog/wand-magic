<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>霍格沃茨手势施法台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>霍格沃茨手势施法台</h1>
        <p class="subtitle">摄像头识别手掌，握拳蓄力、张开释放魔法</p>
      </div>
      <div class="runtime-status" id="runtimeStatus">未启动</div>
    </header>

    <main class="workspace">
      <section class="stage-wrap">
        <div class="stage" id="stage">
          <video id="camera" autoplay muted playsinline></video>
          <canvas id="effectCanvas"></canvas>
          <div class="calibration-target" id="calibrationTarget" hidden>
            <div class="calibration-ring"></div>
            <div class="calibration-label" id="calibrationLabel">请张开手掌放在圆圈中</div>
            <div class="calibration-progress">
              <span id="calibrationProgress"></span>
            </div>
          </div>
          <div class="charge-meter" id="chargeMeter" hidden>
            <span class="charge-label" id="chargeLabel">蓄力</span>
            <div class="charge-track"><span id="chargeFill"></span></div>
            <span class="charge-value" id="chargeValue">0%</span>
          </div>
          <div class="wand-status" id="wandStatus">手掌：等待识别</div>
          <div class="cast-banner" id="castBanner" hidden></div>
        </div>
      </section>

      <aside class="control-panel">
        <section class="panel-section">
          <h2>启动</h2>
          <div class="button-grid">
            <button id="startButton" class="primary">开启摄像头与麦克风</button>
            <button id="calibrateButton" disabled>校准手掌</button>
            <button id="stopButton" class="danger" disabled>停止施法</button>
          </div>
          <div class="status-list">
            <div><span>摄像头</span><strong id="cameraStatus">未连接</strong></div>
            <div><span>麦克风</span><strong id="micStatus">未连接</strong></div>
            <div><span>手势识别</span><strong id="handStatus">未启用</strong></div>
            <div><span>语音识别</span><strong id="speechStatus">未启动</strong></div>
          </div>
        </section>

        <section class="panel-section">
          <h2>中文咒语</h2>
          <div class="spell-list" id="spellList"></div>
        </section>

        <section class="panel-section">
          <h2>语音反馈</h2>
          <div class="transcript" id="transcript">等待启动</div>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
